<!--Indica que o documento utiliza HTML5-->
<!DOCTYPE html>
<!--Define o idioma da página como português do Brasil e a direção do texto como esquerda para direita-->
<html lang="pt-br" dir="ltr">

<head>
    <!--Permite utilizar caracteres especiais, como ç e acentos-->
    <meta charset="UTF-8">
    <!--Adapta a página ao tamanho da tela do dispositivo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Define o título que aparece na aba do navegador-->
    <title>Cadastro - Grana Bacana</title>
    <!--Conecta o arquivo CSS responsável pela aparência da página-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>

<!--Inicia o conteúdo visível da página-->
<body>
    <!--Cria a área principal que envolve o cadastro-->
    <main>
        <!--Cabeçalho utilizado para posicionar a logo-->
        <header>
            <!--Adiciona a imagem da logo da Grana Bacana-->
            <img class="logo" src="static/uploads/logo.png" alt="Logo Grana Bacana">
        </header>

        <!--Exibe o título principal da página-->
        <h2>Cadastro</h2>
        <!--Exibe um pequeno texto abaixo do título-->
        <p class="subtitulo">Acesse sua conta</p>

        <!--Busca as mensagens temporárias enviadas pelo Flask, incluindo suas categorias-->
        {% with messages = get_flashed_messages(with_categories=true) %}
            <!--Verifica se existe alguma mensagem para exibir-->
            {% if messages %}
                <!--Cria uma área para organizar as mensagens-->
                <div class="flash">
                    <!--Percorre todas as mensagens recebidas e suas respectivas categorias-->
                    {% for category, message in messages %}
                        <!--Exibe a mensagem e utiliza sua categoria como classe-->
                        <div class="flash {{ category }}">{{ message }}</div>
                    <!--Encerra o laço de repetição-->
                    {% endfor %}
                </div>
            <!--Encerra a condição que verifica a existência de mensagens-->
            {% endif }
        <!--Encerra o bloco de recebimento das mensagens-->
        {% endwith %}

        <!--Cria o formulário e define para onde e como os dados serão enviados-->
        <form action="{{ url_for('pagina_cadastro') }}" method="POST">
            <!--Agrupa o ícone e o campo de nome completo-->
            <div class="campo">
                <!--Reserva o espaço para o ícone-->
                <img src="static/uploads/Icone-de-pessoa.png" alt="Ícone de pessoa">
                <!--Cria um campo de texto para o nome completo, que é obrigatório-->
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <!--Agrupa o ícone e o campo de e-mail-->
            <div class="campo">
                <!--Reserva o espaço para o ícone-->
                <img src="static/uploads/Icone-de-email.png" alt="Ícone de email">
                <!--Cria um campo para o e-mail e verifica se o formato é válido-->
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <!--Agrupa o ícone e o campo de senha-->
            <div class="campo">
                <!--Reserva o espaço para o ícone-->
                <img src="static/uploads/Icone-de-cadeado.png" alt="Ícone de cadeado">
                <!--Cria um campo de senha, ocultando os caracteres digitados-->
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
            </div>

            <!--Agrupa o ícone de o campo de confirmação de senha-->
            <div class="campo">
                <!--Reserva o espaço para o ícone-->
                <img src="static/uploads/Icone-de-cadeado.png" alt="Ícone de cadeado">
                <!--Cria um campo para o usuário confirmar a senha digitada-->
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirmar senha" required>
            </div>

            <!--Agrupa os campos relacionados aos valores adicionais-->
            <div class="segunda_parte">
                <!--Agrupa o ícone e o campo de valor da diária-->
                <div class="campo">
                    <!--Reserva o espaço para o ícone-->
                    <img src="static/uploads/Icone-de-moedas.png" alt="Ícone de moedas">
                    <!--Cria um campo numérico para informar o valor da diária-->
                    <input type="number" id="Vdiaria" name="Vdiaria" placeholder="Valor da diária" required>
                 </div>

                 <!--Agrupa o ícone e o campo de quantidade mínima de pacotes-->
                 <div class="campo">
                    <!--Reserva o espaço para o ícone-->
                    <img src="static/uploads/Icone-de-caixa.png" alt="Ícone de caixa">
                    <!--Cria um campo numérico para informar a quantidade mínima de pacotes-->
                    <input type="number" id="minPacotes" name="minPacotes" placeholder="Mínimo de pacotes para adicional" required>
                 </div>

                 <!--Agrupa o ícone e o campo de valor adicional-->
                 <div class="campo">
                    <!--Reserva o espaço para o ícone-->
                    <img src="static/uploads/Icone-de-moedas.png" alt="Ícone de moedas">
                    <!--Cria um campo numérico para informar o valor adicional-->
                    <input type="number" id="adicional" name="adicional" placeholder="Valor adicional" required>
                 </div>
            <!--Encerra a área dos campos adicionais-->     
            </div>
            <!--Cria o botão que envia as informações preenchidas-->
            <button type="submit">Cadastrar</button>
        <!--Encerra o formulário-->    
        </form>
    <!--Encerra o conteúdo da página-->    
    </main>
</body>
<!--Encerra o html-->
</html>
